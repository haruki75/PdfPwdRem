<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Apri link</title>
  <style>
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial}
    .wrap{height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f7f9fc,#eef6ff)}
    .btn{
      appearance:none;border:0;padding:16px 28px;font-size:18px;border-radius:12px;cursor:pointer;box-shadow:0 6px 18px rgba(20,40,80,0.12);background:#0b63d6;color:#fff;transition:transform .12s ease,box-shadow .12s ease
    }
    .btn:active{transform:translateY(1px)}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  </style>
</head>
<body>
  <div class="wrap">
    <button class="btn" id="openBtn" aria-label="Apri PdfPwdRem">Apri PdfPwdRem</button>
  </div>

  <script>
    const url = 'https://haruki75.github.io/PdfPwdRem/pprem.html';
    document.getElementById('openBtn').addEventListener('click', () => {
      // Apri in nuova scheda in modo sicuro
      window.open(url, '_blank', 'noopener,noreferrer');
    });

    // Permetti anche apertura via Enter quando il bottone è a fuoco
    document.getElementById('openBtn').addEventListener('keyup', (e) => {
      if (e.key === 'Enter' || e.key === ' ') window.open(url, '_blank', 'noopener,noreferrer');
    });
  </script>
</body>
</html>
